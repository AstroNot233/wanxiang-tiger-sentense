schema:
  schema_id: tiger_chars
  name: 万象虎·单字
  version: "2026.11"
  dependencies: []

switches:
  - name: ascii_mode
    states: [中文, 英文]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  algebra:
    - "derive/^([a-z])$/$1'/"

translator:
  dictionary: tiger_chars
  prism: tiger_chars
  enable_sentence: false
  enable_completion: false
  enable_user_dict: false
